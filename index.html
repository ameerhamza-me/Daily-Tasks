
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Bar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-left">
            <span class="menu-icon">☰</span>
            <h2>Task Bar</h2>
        </div>
        <button type="button" class="new-btn" id="newBtn">+ New</button>
    </header>
    <main class="task-form" id="taskForm">
        <div class="title-row">
            <label for="taskTitle">Title:</label>
            <input type="text" id="taskTitle" placeholder="Enter your Task">
        </div>
        <div class="save-row">
            <button type="button" class="save-btn" id="saveBtn">Save</button>
        </div>
        <div id="taskList" class="task-list"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
